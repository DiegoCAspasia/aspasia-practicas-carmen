<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de artículos HTML</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main>
        <h1>Generador de artículos HTML</h1>
        <p class="intro">Construye artículos para tu página web mediante bloques
            y genera automáticamente su código HTML.
        </p>

        <!--Botones para añadir bloques-->
        <section class="herramientas">
            <h2>Añadir contenido</h2>
            <div class="botones">
                <button id="btnH1">Añadir H1</button>
                <button id="btnH2">Añadir H2</button>
                <button id="btnH3">Añadir H3</button>
                <button id="btnParrafo">Añadir párrafo</button>
                <button id="btnLista">Añadir Lista</button>
                <button id="btnImagen">Añadir imagen</button>
                <button id="btnCTA">Añadir CTA</button>
                <button id="btnBorrar">Borrar artículo</button>
            </div>

            <label class="opcion">
                <input type="checkbox" id="crearIndice">
                Crear índice automático
            </label>
        </section>

        <!--Editor de bloques-->
        <section>
            <h2>Contenido del artículo</h2>
            <div id="listaBloques"></div>
        </section>

        <!--Resultados-->
        <section>
            <h2>Vista previa del artículo</h2>
            <article id="vistaPrevia"></article>

            <h2>Código HTML generado</h2>
            <textarea id="codigoHTML" readonly></textarea>

            <p id="errores"></p>
            <button id="btnCopiar">Copiar código HTML</button>
        </section>
    </main>
    <script src="../../js/utilidades.js" type="module"></script>
    <script src="scripts.js" type="module"></script>
    
</body>
</html>
