<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Herramienta gratuita para contar palabras, caracteres y calcular el tiempo">
    <title>Contador de palabras y tiempo de lectura</title>
    
    <!--Enlace al archivo CSS-->
    <link rel="stylesheet" href="../../css/base.css">
   
</head>
<body>
    <main>
        <h1>Contador de palabras</h1>
        <p class="intro">
            Analiza tu texto y calcula cuánto tardarás en leerlo.
        </p>

        <!--Lugar para escribir o pegar el texto-->
        <label for="texto">Introduce o pega tu texto:</label>
        <textarea id="texto" placeholder="Escribe o pega aquí tu texto...."></textarea>

        <!--Opciones de lectura-->
        <section class="controls" aria-label="Configuración">
            <div>
                <label for="velocidad">Velocidad de lectura:</label>
                <select id="velocidad">
                    <option value="180">Lenta (180 palabras/min)</option>
                    <option value="230" selected>Media (230 palabras/min)</option>
                    <option value="280">Rápida (280 palabras/min)</option>
                </select>
            </div>
            <button id="copiar" type="button">Copiar estadísticas</button>
        </section>

        <!--Resultados del texto-->
        <section aria-labelledby="resultados-titulo">
            <h2 id="resultados-titulo">Resultados del análisis</h2>
            <div class="results" aria-live="polite" aria-atomic="true">
                <article class="metric">
                    <h3>Palabras</h3>
                    <p id="palabras">0</p>
                </article>
                <article class="metric">
                    <h3>Caracteres con espacios</h3>
                    <p id="conEspacios">0</p>
                </article>
                <article class="metric">
                    <h3>Caracteres sin espacios</h3>
                    <p id="sinEspacios">0</p>
                </article>
                <article class="metric">
                    <h3>Frases</h3>
                    <p id="frases">0</p>
                </article>
                <article class="metric">
                    <h3>Párrafos</h3>
                    <p id="parrafos">0</p>
                </article>
                <article class="metric">
                    <h3>Tiempo de lectura</h3>
                    <p id="tiempo">0 min 0 s</p>
                </article>
            </div>
        </section>
        <!--Mensaje al copiar los resultados-->
        <p class="status" id="estado" role="status"></p>
    </main>

    <!--Enlace al archivo JavaScript-->
   <script src="script.js"></script>
</body>
</html>
